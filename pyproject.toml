[project]
name = "sentinel"
version = "0.1.0"
description = "Agentic-Commerce Transaction Sentinel: mandate verification, scope enforcement, and behavioral anomaly detection for AI-agent-initiated payments."
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { text = "MIT" }

# Pinned to exact resolved versions rather than ranges, so eval numbers are
# reproducible from a clean clone regardless of what resolves later.
dependencies = [
    "pydantic==2.13.4",
    "cryptography==50.0.0",
    "numpy==2.5.2",
    "scipy==1.18.1",
    "scikit-learn==1.9.0",
    # SHAP attribution for the behavioral layer; pulls numba, pandas and
    # cloudpickle into the closure, all pinned in requirements-lock.txt.
    "shap==0.52.0",
    # Groq client for Layer 4 (reasoning/narration); pulls httpx, anyio,
    # distro, sniffio, certifi into the closure, all pinned in
    # requirements-lock.txt.
    "groq==1.7.0",
    # The API service wrapping the full pipeline.
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    # Z3 SMT solver, formally verifying the deterministic layers' decision
    # logic (never the ML ensemble -- see /formal).
    "z3-solver==5.1.0.0",
    # Graph construction and Louvain community detection for
    # cross-session/cross-agent collusion-ring detection -- see /collusion.
    "networkx==3.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
    "mypy==2.3.1",
    # Loads GROQ_API_KEY (and any other local secret) from a gitignored
    # .env file for local test runs (see tests/conftest.py). Dev-only: a
    # real deployment (the API service) sets environment
    # variables through its own runtime, not a checked-out .env file.
    "python-dotenv==1.2.3",
]
# The dashboard is a static export with no server-side dependencies of its
# own (see frontend/); nothing further is pinned speculatively here.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mandate*", "common*", "generator*", "features*", "detect*", "reasoning*", "eval*", "service*", "containment*", "formal*", "collusion*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle core. D: pydocstyle (Google-style docstrings are
# mandatory). ANN: require type annotations. B: bugbear catches real
# correctness bugs (mutable defaults, etc), which matters more here than style.
select = ["E", "F", "D", "ANN", "B", "I"]
ignore = ["D203", "D213"]  # conflicting docstring formatting rules, pick one style below

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own dependency-injection idiom is `param: T = Depends(...)` in a
# function signature's default position -- indistinguishable from the real
# mutable-default-argument bug B008 exists to catch, so these specific
# calls are declared immutable rather than suppressing the rule file-wide.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.mypy]
# Pinned to 3.12, not the 3.11 floor in requires-python, because numpy
# 2.5.2's own .pyi stubs use PEP 695 `type` statements unconditionally and
# fail to parse under a declared 3.11 target — a numpy/mypy stub issue, not
# a constraint on our code. Source avoids any 3.12-only syntax (checked by
# ruff's target-version = "py311" above), so 3.11 runtime compatibility is
# enforced there instead of here.
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"